# Generated from packages/*/upstream. Do not edit by hand.
#   scripts/gen-nvchecker.sh
[__config__]
oldver = "nvchecker-old.json"
newver = "nvchecker-new.json"

[keeper-password-manager]
source = "regex"
url = "https://keepersecurity.com/desktop_electron/SHASUM256.txt"
regex = 'keeperpasswordmanager_([0-9.]+)_amd64\.deb'

[slack-desktop]
source = "regex"
url = "https://packagecloud.io/slacktechnologies/slack/debian/dists/jessie/main/binary-amd64/Packages"
regex = 'slack-desktop_([0-9.]+)_amd64\.deb'

[brother-hll9310cdw-lpr]
source = "regex"
url = "https://download.brother.com/welcome/dlf103212/hll9310cdwlpr-1.5.0-3.i386.rpm"
regex = 'hll9310cdwlpr-([0-9.]+)-3\.i386\.rpm'

[brother-hll9310cdw-cups]
source = "regex"
url = "https://download.brother.com/welcome/dlf103221/hll9310cdwcupswrapper-1.5.0-3.i386.rpm"
regex = 'hll9310cdwcupswrapper-([0-9.]+)-3\.i386\.rpm'

[gitkraken]
source = "regex"
url = "https://api.gitkraken.dev/releases/production/linux/x64/RELEASES"
regex = '"name":"([0-9.]+)"'

[android-studio]
source = "regex"
url = "https://developer.android.com/studio"
regex = 'ide-zips/([0-9.]+)/android-studio-[A-Za-z0-9._-]+-linux\.tar\.gz'
